version: '3'
services:
  db:
    container_name: postgres_db
    image: postgres:latest
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    container_name: EsAbDe
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/EsAbDe-backend
    depends_on:
      - db
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data: